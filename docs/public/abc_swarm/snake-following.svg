<g font-family="sans-serif" font-size="17" fill="#25334b"><text x="25" y="35">蛇形跟随 · 01带02，02带03</text><path d="M507 130 L370 130" stroke="#61718c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M302 130 L165 130" stroke="#61718c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><circle cx="535.00" cy="130.00" r="19" fill="#da4353"/><text x="535.00" y="136.00" fill="white" font-weight="bold" text-anchor="middle">01</text><path d="M556.60 130.00 L578.20 130.00" stroke="#da4353" stroke-width="4" marker-end="url(#arrow)"/><text x="535.00" y="178.00" text-anchor="middle">头车</text><circle cx="330.00" cy="130.00" r="19" fill="#26834a"/><text x="330.00" y="136.00" fill="white" font-weight="bold" text-anchor="middle">02</text><path d="M351.60 130.00 L373.20 130.00" stroke="#26834a" stroke-width="4" marker-end="url(#arrow)"/><text x="330.00" y="178.00" text-anchor="middle">跟随01</text><circle cx="125.00" cy="130.00" r="19" fill="#287fbd"/><text x="125.00" y="136.00" fill="white" font-weight="bold" text-anchor="middle">03</text><path d="M146.60 130.00 L168.20 130.00" stroke="#287fbd" stroke-width="4" marker-end="url(#arrow)"/><text x="125.00" y="178.00" text-anchor="middle">跟随02</text><text x="25" y="242" font-size="14">三车同向摆放，相邻目标偏移0.5m；转弯不保证严格复走头车历史轨迹。</text></g></svg>