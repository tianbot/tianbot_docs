<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img" aria-label="三车在同一个圆上相隔120度的起点示意">
<rect width="680" height="490" rx="14" fill="#f5f8fc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61718c"/></marker></defs>
<g font-family="sans-serif" font-size="17" fill="#25334b"><text x="25" y="30">同一个圆 · 直径2m · 初始120°间隔</text><circle cx="340" cy="230" r="160" fill="none" stroke="#61718c" stroke-width="2"/><path d="M328 230 H352 M340 218 V242" stroke="#61718c"/><text x="355" y="235">圆心 (0,1)</text><circle cx="340.00" cy="390.00" r="19" fill="#da4353"/><text x="340.00" y="396.00" fill="white" font-weight="bold" text-anchor="middle">01</text><path d="M361.60 390.00 L383.20 390.00" stroke="#da4353" stroke-width="4" marker-end="url(#arrow)"/><text x="340.00" y="438.00" text-anchor="middle">第一起点 (0,0)</text><circle cx="478.56" cy="150.00" r="19" fill="#26834a"/><text x="478.56" y="156.00" fill="white" font-weight="bold" text-anchor="middle">02</text><path d="M467.76 131.29 L456.96 112.59" stroke="#26834a" stroke-width="4" marker-end="url(#arrow)"/><text x="478.56" y="198.00" text-anchor="middle">起点02</text><circle cx="201.44" cy="150.00" r="19" fill="#287fbd"/><text x="201.44" y="156.00" fill="white" font-weight="bold" text-anchor="middle">03</text><path d="M190.64 168.71 L179.84 187.41" stroke="#287fbd" stroke-width="4" marker-end="url(#arrow)"/><text x="201.44" y="198.00" text-anchor="middle">起点03</text><text x="25" y="474" font-size="14">示例：01沿+X出发；实际圆的位置由01启动时的位姿冻结。</text></g></svg>